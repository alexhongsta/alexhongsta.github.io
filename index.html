<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Hong × HONGSTA</title>
  <meta name="description" content="Alex Hong — engineering. HONGSTA — music. Two practices, one person.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FAFAF7;
      --ink: #17171A;
      --ink-soft: #55555C;
      --paper-soft: #B9B9B2;
      --accent: #2B4FF0;
      --accent-dark: #93A5FF; /* same signal, tinted for dark ground */
      --hairline-dark: rgba(23, 23, 26, .16);
      --hairline-light: rgba(250, 250, 247, .18);
      --sans: "Geist", "Helvetica Neue", sans-serif;
      --mono: "Geist Mono", "Consolas", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      background: var(--ink);
    }

    .split { flex: 1; display: flex; min-height: 0; }

    .side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 4vw, 56px);
      text-decoration: none;
      min-width: 0;
      transition: flex .4s cubic-bezier(.4, 0, .2, 1);
    }
    @media (prefers-reduced-motion: no-preference) {
      .side:hover, .side:focus-visible { flex: 1.25; }
    }
    .side:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

    .side .index {
      font-family: var(--mono);
      font-size: .78rem;
      letter-spacing: .08em;
    }

    .side .block { max-width: 30ch; }
    .side h1 {
      font-size: clamp(2.6rem, 6.5vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: .98;
      margin-bottom: 18px;
    }
    .side p {
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .side .enter {
      font-family: var(--mono);
      font-size: .82rem;
      letter-spacing: .06em;
    }
    .side .enter::after { content: " →"; }
    .side:hover .enter, .side:focus-visible .enter { text-decoration: underline; text-underline-offset: 4px; }

    /* Alex — paper */
    .side--alex { background: var(--paper); color: var(--ink); }
    .side--alex .index { color: var(--ink-soft); }
    .side--alex p { color: var(--ink-soft); }
    .side--alex .enter { color: var(--accent); }

    /* HONGSTA — ink */
    .side--hongsta { background: var(--ink); color: var(--paper); border-left: 1px solid var(--hairline-light); }
    .side--hongsta .index { color: var(--paper-soft); }
    .side--hongsta h1 { font-style: italic; font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -.02em; }
    .side--hongsta p { color: var(--paper-soft); }
    .side--hongsta .enter { color: var(--accent-dark); }

    /* signature moment: names settle on load */
    @media (prefers-reduced-motion: no-preference) {
      .side .block { animation: settle .8s cubic-bezier(.25, .1, .25, 1) both; }
      .side--hongsta .block { animation-delay: .12s; }
      @keyframes settle {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
      }
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 14px clamp(24px, 4vw, 56px);
      background: var(--paper);
      border-top: 1px solid var(--hairline-dark);
      font-family: var(--mono);
      font-size: .74rem;
      letter-spacing: .06em;
      color: var(--ink-soft);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover, footer a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
    footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 700px) {
      .split { flex-direction: column; }
      .side { justify-content: flex-end; gap: 40px; }
      .side--hongsta { border-left: none; border-top: 1px solid var(--hairline-light); }
    }
  </style>
</head>
<body>

  <main class="split">

    <a class="side side--alex" href="alex.html">
      <span class="index">01 / ENGINEERING</span>
      <span class="block">
        <h1>Alex Hong</h1>
        <p>Mechanical engineering — research, projects, and work history. Stanford, class of 2028.</p>
        <span class="enter">ENTER PORTFOLIO</span>
      </span>
    </a>

    <a class="side side--hongsta" href="hongsta.html">
      <span class="index">02 / MUSIC</span>
      <span class="block">
        <h1>Hongsta</h1>
        <p>Tracks I've made and sets I've played.</p>
        <span class="enter">ENTER THE BOOTH</span>
      </span>
    </a>

  </main>

  <footer>
    <span>ALEX HONG — TWO PRACTICES, ONE PERSON</span>
    <span><a href="mailto:alexjyh@stanford.edu">alexjyh@stanford.edu</a> · <a href="mailto:hongstamgmt@gmail.com">hongstamgmt@gmail.com</a></span>
  </footer>

</body>
</html>
